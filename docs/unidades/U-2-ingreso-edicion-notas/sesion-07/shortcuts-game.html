<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desafío de Shortcuts — MuseScore</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
  }
  #container {
    display: flex; flex-direction: column; align-items: center;
    gap: 10px; position: relative;
  }
  #platform-select {
    display: flex; gap: 8px;
  }
  #platform-select button {
    padding: 8px 24px; border: 2px solid #4a4a6a; border-radius: 8px;
    background: #16213e; color: #8899aa; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: all 0.2s;
  }
  #platform-select button.active {
    background: #0f3460; color: #e94560; border-color: #e94560;
    box-shadow: 0 0 12px rgba(233,69,96,0.3);
  }
  #game-area {
    position: relative; display: inline-block;
    border-radius: 16px; overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  #shortcut-input {
    position: absolute;
    background: rgba(22, 33, 62, 0.97);
    color: #e0e0f0;
    border: 2px solid #e94560;
    border-radius: 8px;
    font-family: 'Courier New', monospace;
    font-size: 20px; font-weight: bold;
    text-align: center;
    outline: none;
    caret-color: #e94560;
    letter-spacing: 1px;
    z-index: 10;
  }
  #shortcut-input::placeholder { color: #444; font-weight: normal; }
  #shortcut-input.wrong { border-color: #ff4444; background: rgba(80,20,20,0.97); animation: shake 0.3s; }
  #shortcut-input.correct { border-color: #44ff44; background: rgba(20,80,20,0.97); }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }
  #fullscreen-badge {
    position: absolute; top: 12px; right: 16px;
    background: rgba(0,0,0,0.6); color: #888; font-size: 11px;
    padding: 3px 10px; border-radius: 10px; z-index: 20;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="container">
  <div id="platform-select">
    <button id="btn-pc" class="active">🖥️ Windows / Linux</button>
    <button id="btn-mac">🍎 macOS</button>
  </div>
  <div id="game-area">
    <div id="canvas-wrapper"></div>
    <input type="text" id="shortcut-input" placeholder="Escribe el shortcut..." autocomplete="off" spellcheck="false" autocorrect="off" autocapitalize="off">
    <div id="fullscreen-badge">Presiona F11 para pantalla completa</div>
  </div>
</div>

<script>
// ── Shortcut database ──
const shortcuts = [
  { fn:"Activar/desactivar modo de ingreso", pc:"N", mac:"N", cat:"Ingreso" },
  { fn:"Salir del modo de ingreso", pc:"Esc", mac:"Esc", cat:"Ingreso" },
  { fn:"Duración: semifusa", pc:"1", mac:"1", cat:"Ingreso" },
  { fn:"Duración: fusa", pc:"2", mac:"2", cat:"Ingreso" },
  { fn:"Duración: semicorchea", pc:"3", mac:"3", cat:"Ingreso" },
  { fn:"Duración: corchea", pc:"4", mac:"4", cat:"Ingreso" },
  { fn:"Duración: negra", pc:"5", mac:"5", cat:"Ingreso" },
  { fn:"Duración: blanca", pc:"6", mac:"6", cat:"Ingreso" },
  { fn:"Duración: redonda", pc:"7", mac:"7", cat:"Ingreso" },
  { fn:"Ingresar nota (La a Sol)", pc:"A – G", mac:"A – G", cat:"Ingreso" },
  { fn:"Sostenido (♯)", pc:"+", mac:"+", cat:"Ingreso" },
  { fn:"Bemol (♭)", pc:"-", mac:"-", cat:"Ingreso" },
  { fn:"Becuadro (♮)", pc:"=", mac:"=", cat:"Ingreso" },
  { fn:"Puntillo", pc:".", mac:".", cat:"Ingreso" },
  { fn:"Silencio", pc:"0", mac:"0", cat:"Ingreso" },
  { fn:"Añadir nota al acorde", pc:"Shift + letra", mac:"Shift + letra", cat:"Ingreso" },
  { fn:"Ligadura de prolongación", pc:"T", mac:"T", cat:"Ingreso" },
  { fn:"Ligadura de fraseo", pc:"S", mac:"S", cat:"Ingreso" },
  { fn:"Subir un semitono", pc:"↑", mac:"↑", cat:"Edición" },
  { fn:"Bajar un semitono", pc:"↓", mac:"↓", cat:"Edición" },
  { fn:"Subir una octava", pc:"Ctrl + ↑", mac:"Cmd + ↑", cat:"Edición" },
  { fn:"Bajar una octava", pc:"Ctrl + ↓", mac:"Cmd + ↓", cat:"Edición" },
  { fn:"Aumentar duración", pc:"Shift + W", mac:"Shift + W", cat:"Edición" },
  { fn:"Reducir duración", pc:"Shift + Q", mac:"Shift + Q", cat:"Edición" },
  { fn:"Duplicar duración", pc:"W", mac:"W", cat:"Edición" },
  { fn:"Reducir duración a la mitad", pc:"Q", mac:"Q", cat:"Edición" },
  { fn:"Cambiar enarmonía", pc:"J", mac:"J", cat:"Edición" },
  { fn:"Modo Re-pitch", pc:"Ctrl + Shift + I", mac:"Cmd + Shift + I", cat:"Edición" },
  { fn:"Acercar zoom", pc:"Ctrl + +", mac:"Cmd + +", cat:"Navegación" },
  { fn:"Alejar zoom", pc:"Ctrl + -", mac:"Cmd + -", cat:"Navegación" },
  { fn:"Ir a compás", pc:"Ctrl + G", mac:"Cmd + G", cat:"Navegación" },
  { fn:"Seleccionar todo", pc:"Ctrl + A", mac:"Cmd + A", cat:"Selección" },
  { fn:"Copiar", pc:"Ctrl + C", mac:"Cmd + C", cat:"Portapapeles" },
  { fn:"Cortar", pc:"Ctrl + X", mac:"Cmd + X", cat:"Portapapeles" },
  { fn:"Pegar", pc:"Ctrl + V", mac:"Cmd + V", cat:"Portapapeles" },
  { fn:"Repetir selección", pc:"R", mac:"R", cat:"Portapapeles" },
  { fn:"Deshacer", pc:"Ctrl + Z", mac:"Cmd + Z", cat:"Archivo" },
  { fn:"Rehacer", pc:"Ctrl + Shift + Z", mac:"Cmd + Shift + Z", cat:"Archivo" },
  { fn:"Guardar", pc:"Ctrl + S", mac:"Cmd + S", cat:"Archivo" },
  { fn:"Guardar como", pc:"Ctrl + Shift + S", mac:"Cmd + Shift + S", cat:"Archivo" },
  { fn:"Insertar un compás", pc:"Ins", mac:"Ins", cat:"Compases" },
  { fn:"Añadir compás al final", pc:"Ctrl + B", mac:"Cmd + B", cat:"Compases" },
  { fn:"Eliminar compás", pc:"Ctrl + Supr", mac:"Cmd + Supr", cat:"Compases" },
  { fn:"Reproducir / Pausar", pc:"Espacio", mac:"Espacio", cat:"Reproducción" },
];

// ── State ──
let platform = 'pc';
let currentShortcut = null;
let score = 0, streak = 0, bestStreak = 0, totalCorrect = 0, totalWrong = 0;
let timeLeft = 60, gameActive = false, gameOver = false;
let feedback = '', feedbackTimer = 0;
let questionIndex = 0, shuffled = [];
let inputEl, gameArea;
let flashWrong = 0, flashCorrect = 0;

function setPlatform(p) {
  platform = p;
  document.getElementById('btn-pc').className = p === 'pc' ? 'active' : '';
  document.getElementById('btn-mac').className = p === 'mac' ? 'active' : '';
  if (gameActive && inputEl) inputEl.focus();
}

function shuffle(arr) { const a = [...arr]; for (let i = a.length-1; i>0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function nextQuestion() {
  if (questionIndex >= shuffled.length) { shuffled = shuffle(shortcuts); questionIndex = 0; }
  currentShortcut = shuffled[questionIndex++];
  inputEl.value = '';
  inputEl.className = '';
  inputEl.focus();
}

function normalize(s) { return s.replace(/\s+/g, '').toLowerCase(); }

function gotWrong() {
  score--;
  totalWrong++;
  streak = 0;
  feedbackTimer = 60;
  flashWrong = 15;
  inputEl.className = 'wrong';
  const correct = platform === 'pc' ? currentShortcut.pc : currentShortcut.mac;
  feedback = `✗  Era: ${correct}`;
  // Auto-advance after short delay
  setTimeout(() => {
    if (gameActive && !gameOver) {
      inputEl.className = '';
      nextQuestion();
    }
  }, 1000);
}

// ── REAL-TIME validation on every keystroke ──
inputEl = document.getElementById('shortcut-input');
gameArea = document.getElementById('game-area');

inputEl.addEventListener('input', () => {
  if (!gameActive || gameOver) return;
  const typed = inputEl.value;
  if (!typed) return;

  const correct = platform === 'pc' ? currentShortcut.pc : currentShortcut.mac;
  const nTyped = normalize(typed);
  const nCorrect = normalize(correct);

  // Check if full match (correct!)
  if (nTyped === nCorrect) {
    score++;
    totalCorrect++;
    streak++;
    if (streak > bestStreak) bestStreak = streak;
    feedbackTimer = 40;
    flashCorrect = 10;
    inputEl.className = 'correct';
    feedback = '✓  ¡Correcto!';
    setTimeout(() => {
      if (gameActive && !gameOver) {
        inputEl.className = '';
        nextQuestion();
      }
    }, 500);
    return;
  }

  // Check if what's typed so far could be a prefix of the correct answer
  if (nCorrect.startsWith(nTyped)) {
    // Still on track — neutral
    inputEl.className = '';
    feedback = '';
    feedbackTimer = 0;
  } else {
    // Wrong! It can't possibly lead to the correct answer
    gotWrong();
  }
});

// Catch Enter/Escape
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    e.preventDefault();
    if (!gameActive || gameOver) return;
    const typed = inputEl.value.trim();
    if (!typed) return;
    const correct = platform === 'pc' ? currentShortcut.pc : currentShortcut.mac;
    if (normalize(typed) === normalize(correct)) {
      // Already handled by input event above in most cases, but just in case:
      if (inputEl.className !== 'correct') {
        score++; totalCorrect++; streak++;
        if (streak > bestStreak) bestStreak = streak;
        feedbackTimer = 40; flashCorrect = 10;
        inputEl.className = 'correct';
        feedback = '✓  ¡Correcto!';
        setTimeout(() => { if (gameActive && !gameOver) { inputEl.className = ''; nextQuestion(); } }, 500);
      }
    } else {
      gotWrong();
    }
  }
  if (e.key === 'Escape') {
    inputEl.value = '';
    inputEl.className = '';
    feedback = '';
    feedbackTimer = 0;
  }
  e.stopPropagation();
});

// ── BLOCK browser shortcuts in fullscreen ──
document.addEventListener('keydown', e => {
  if (!gameActive || gameOver) return;
  // Block common browser shortcuts that would steal focus
  const blocked = [
    't','n','w','h','j','k','d','l','p','r','s','u','f','g',
    'Tab','F5','F11','F12'
  ];
  const isBlocked = blocked.includes(e.key) && (e.ctrlKey || e.metaKey);
  // Also block plain F5, F11, F12
  const isFnKey = ['F5','F11','F12'].includes(e.key);

  if ((isBlocked || isFnKey) && document.fullscreenElement) {
    e.preventDefault();
    e.stopPropagation();
    return false;
  }
  if (e.key === 'Tab' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    return false;
  }
}, { capture: true });

// Block right-click context menu in game area
gameArea.addEventListener('contextmenu', e => {
  if (gameActive && !gameOver) e.preventDefault();
});

// ── Fullscreen toggle ──
document.addEventListener('keydown', e => {
  if (e.key === 'F11') {
    e.preventDefault();
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen();
    }
  }
});

// ── Platform buttons ──
document.getElementById('btn-pc').addEventListener('click', () => setPlatform('pc'));
document.getElementById('btn-mac').addEventListener('click', () => setPlatform('mac'));

// Reposition input over canvas
function repositionInput() {
  const wrapper = document.getElementById('canvas-wrapper');
  const canvas = wrapper?.querySelector('canvas');
  if (!canvas || !inputEl) return;
  const rect = canvas.getBoundingClientRect();
  const gaRect = gameArea.getBoundingClientRect();
  inputEl.style.left = (rect.left - gaRect.left + 170) + 'px';
  inputEl.style.top = (rect.top - gaRect.top + 260) + 'px';
  inputEl.style.width = '300px';
  inputEl.style.height = '46px';
}
setInterval(repositionInput, 200);

// Timer
setInterval(() => {
  if (gameActive && !gameOver && timeLeft > 0) {
    timeLeft -= 0.05;
    if (timeLeft <= 0) {
      timeLeft = 0;
      gameActive = false;
      gameOver = true;
      inputEl.value = '';
      inputEl.className = '';
      inputEl.blur();
    }
  }
}, 50);

// ── p5 sketch ──
new p5(p => {
  p.setup = () => { p.createCanvas(640, 500).parent('canvas-wrapper'); p.textFont('monospace'); };

  p.draw = () => {
    // Flash background
    if (flashWrong > 0) { flashWrong--; p.background(60, 20, 20); }
    else if (flashCorrect > 0) { flashCorrect--; p.background(20, 60, 20); }
    else p.background(26, 26, 46);

    // Title
    p.fill(233, 69, 96); p.noStroke();
    p.rect(0, 0, 640, 56);
    p.fill(255); p.textSize(22); p.textAlign(p.CENTER, p.CENTER); p.textStyle(p.BOLD);
    p.text('🎹  Desafío de Shortcuts  🎹', 320, 28);

    // Score & streak
    p.textSize(14); p.textStyle(p.NORMAL);
    p.textAlign(p.LEFT); p.fill(200); p.text(`Puntaje: ${score}`, 24, 78);
    p.textAlign(p.RIGHT); p.text(`Racha: ${streak}`, 616, 78);

    // Timer bar
    const barW = 592;
    p.fill(40, 40, 70); p.rect(24, 88, barW, 16, 8);
    if (timeLeft > 0) {
      const frac = timeLeft / 60;
      p.fill(frac > 0.3 ? p.color(233, 69, 96) : p.color(255, 180, 50));
      p.rect(24, 88, barW * frac, 16, 8);
    }
    p.fill(255); p.textSize(12); p.textAlign(p.CENTER); p.text(`${Math.ceil(timeLeft)}s`, 320, 100);

    if (!gameActive && !gameOver) {
      p.fill(255); p.textSize(26); p.textAlign(p.CENTER);
      p.text('¿Listo para el desafío?', 320, 190);
      p.textSize(14); p.fill(180);
      p.text('Escribe el shortcut correcto para cada función.', 320, 230);
      p.text('Presiona F11 para pantalla completa.', 320, 252);
      p.fill(233, 69, 96); p.rect(250, 300, 140, 44, 10);
      p.fill(255); p.textSize(18); p.textStyle(p.BOLD); p.text('▶  JUGAR', 320, 328); p.textStyle(p.NORMAL);
    } else if (gameOver) {
      const acc = totalCorrect+totalWrong > 0 ? Math.round(totalCorrect/(totalCorrect+totalWrong)*100) : 0;
      p.fill(255); p.textSize(26); p.textAlign(p.CENTER); p.textStyle(p.BOLD);
      p.text('⏰  ¡Tiempo!', 320, 170); p.textStyle(p.NORMAL);
      p.textSize(15); p.fill(200);
      p.text(`Puntaje: ${score}  •  Precisión: ${acc}%`, 320, 215);
      p.text(`✓ ${totalCorrect} aciertos  •  ✗ ${totalWrong} fallos  •  🔥 Racha max: ${bestStreak}`, 320, 240);
      p.fill(233, 69, 96); p.rect(250, 310, 140, 44, 10);
      p.fill(255); p.textSize(18); p.text('↻  OTRA VEZ', 320, 338);
    } else if (currentShortcut) {
      p.fill(255); p.textSize(20); p.textAlign(p.CENTER);
      p.text(`« ${currentShortcut.fn} »`, 320, 165);
      p.textSize(11); p.fill(150); p.text(currentShortcut.cat, 320, 188);
      p.fill(200); p.textSize(14); p.text('Escribe el shortcut:', 320, 240);

      // Feedback text
      if (feedbackTimer > 0) {
        feedbackTimer--;
        const alpha = Math.min(1, feedbackTimer / 30);
        const isOk = feedback.startsWith('✓');
        p.fill(isOk ? [80, 255, 100] : [255, 100, 100]);
        p._renderer.drawingContext.globalAlpha = alpha;
        p.textSize(16); p.textAlign(p.CENTER);
        p.text(feedback, 320, 350);
        p._renderer.drawingContext.globalAlpha = 1;
      }
    }

    p.fill(100); p.textSize(10); p.textAlign(p.CENTER);
    p.text('Escribe "Ctrl+N" o "Cmd+N" según plataforma • F11 = pantalla completa', 320, 488);
  };

  function resetGame() {
    score=0;streak=0;bestStreak=0;totalCorrect=0;totalWrong=0;
    timeLeft=60;gameActive=false;gameOver=false;
    feedback='';feedbackTimer=0;flashWrong=0;flashCorrect=0;
    shuffled=shuffle(shortcuts);questionIndex=0;currentShortcut=null;
    if(inputEl){inputEl.value='';inputEl.className='';}
  }

  function startGame() {
    gameActive=true;gameOver=false;
    score=0;streak=0;bestStreak=0;totalCorrect=0;totalWrong=0;
    timeLeft=60;feedback='';feedbackTimer=0;flashWrong=0;flashCorrect=0;
    shuffled=shuffle(shortcuts);questionIndex=0;
    nextQuestion();
  }

  p.mousePressed = () => {
    if (!gameActive && !gameOver && p.mouseX>250 && p.mouseX<390 && p.mouseY>300 && p.mouseY<344) {
      // Also request fullscreen on start
      document.documentElement.requestFullscreen().catch(() => {});
      startGame();
    }
    if (gameOver && p.mouseX>250 && p.mouseX<390 && p.mouseY>310 && p.mouseY<354) {
      resetGame();
    }
    if (gameActive && !gameOver && inputEl) setTimeout(() => inputEl.focus(), 50);
  };
});
</script>
</body>
</html>
