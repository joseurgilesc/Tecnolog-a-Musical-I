site_name: "Tecnología Musical I"
site_description: "Material de clase — Tecnología Musical I (MuseScore Studio)"
site_author: "José Urgilés"
repo_url: https://github.com/joseurgilesc/Tecnolog-a-Musical-I
repo_name: joseurgilesc/Tecnolog-a-Musical-I

theme:
  name: material
  language: es
  logo: img/logo.svg
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.path
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Modo oscuro
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Modo claro

extra_css:
  - https://fonts.googleapis.com/css2?family=Noto+Music&display=swap
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search:
      lang: es

nav:
  - Inicio: index.md
  - Objetivos: objetivos.md
  - Logros de Aprendizaje: logros.md
  - Bibliografía: bibliografia.md
